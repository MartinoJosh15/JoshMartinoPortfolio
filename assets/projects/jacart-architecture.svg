<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">JACart multimodal anomaly-detection architecture</title>
  <desc id="desc">LiDAR, camera, and GPS/IMU data enter a ROS 2 sensor pipeline, flow through MOLA localization and vehicle telemetry, then into multimodal anomaly detection and a locally served model through Ollama.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#10254a"/><stop offset="1" stop-color="#08152c"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#65cfe2"/></marker>
  </defs>
  <rect width="1000" height="700" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" fill="#7dd3e1" font-family="monospace" font-size="18" letter-spacing="3">SYSTEM FLOW / JACART</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(45 100)"><rect width="200" height="80" rx="14" fill="#132e58" stroke="#3569ad"/><text x="100" y="49" fill="#fff" font-size="21" font-weight="700">Velodyne LiDAR</text></g>
    <g transform="translate(45 205)"><rect width="200" height="80" rx="14" fill="#132e58" stroke="#3569ad"/><text x="100" y="49" fill="#fff" font-size="21" font-weight="700">ZED Cameras</text></g>
    <g transform="translate(45 310)"><rect width="200" height="80" rx="14" fill="#132e58" stroke="#3569ad"/><text x="100" y="49" fill="#fff" font-size="21" font-weight="700">GPS / IMU</text></g>
    <path d="M245 140h72M245 245h72M245 350h72M317 140v210" stroke="#65cfe2" stroke-width="3" fill="none"/>
    <path d="M317 245h48" stroke="#65cfe2" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(375 185)"><rect width="270" height="120" rx="17" fill="#173a70" stroke="#42b7dc" stroke-width="2"/><text x="135" y="52" fill="#fff" font-size="25" font-weight="700">ROS 2</text><text x="135" y="83" fill="#b9d2f4" font-size="18">sensor pipeline</text></g>
    <path d="M645 245h74" stroke="#65cfe2" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(729 185)"><rect width="225" height="120" rx="17" fill="#132e58" stroke="#3569ad"/><text x="112" y="52" fill="#fff" font-size="23" font-weight="700">MOLA</text><text x="112" y="83" fill="#9fb7d8" font-size="17">localization</text></g>
    <path d="M841 305v65" stroke="#65cfe2" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(690 380)"><rect width="264" height="95" rx="15" fill="#132e58" stroke="#3569ad"/><text x="132" y="40" fill="#fff" font-size="22" font-weight="700">Vehicle state</text><text x="132" y="68" fill="#9fb7d8" font-size="16">telemetry + health</text></g>
    <path d="M690 427H610" stroke="#65cfe2" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(300 365)"><rect width="300" height="125" rx="17" fill="#173a70" stroke="#42b7dc" stroke-width="2"/><text x="150" y="46" fill="#fff" font-size="23" font-weight="700">Multimodal anomaly</text><text x="150" y="76" fill="#fff" font-size="23" font-weight="700">detection</text><text x="150" y="103" fill="#a8c7f2" font-size="15">telemetry + camera context</text></g>
    <path d="M450 490v62" stroke="#65cfe2" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(300 562)"><rect width="300" height="90" rx="15" fill="#132e58" stroke="#3569ad"/><text x="150" y="39" fill="#fff" font-size="21" font-weight="700">Local LLM / VLM</text><text x="150" y="66" fill="#9fb7d8" font-size="16">served through Ollama</text></g>
    <path d="M600 607h89" stroke="#65cfe2" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(699 562)"><rect width="255" height="90" rx="15" fill="#132e58" stroke="#3569ad"/><text x="127" y="39" fill="#fff" font-size="20" font-weight="700">Artifacts +</text><text x="127" y="66" fill="#fff" font-size="20" font-weight="700">operator insight</text></g>
  </g>
  <text x="48" y="675" fill="#7f99bd" font-family="monospace" font-size="14">SENSOR → LOCALIZATION → CONTEXT → ANALYSIS</text>
</svg>
