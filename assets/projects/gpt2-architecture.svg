<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">GPT-2 architecture</title>
  <desc id="desc">Tokens flow through embeddings, repeated transformer blocks with causal self-attention, a language model head, and autoregressive generation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10254a"/><stop offset="1" stop-color="#08152c"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#22b8cf"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#65cfe2"/></marker>
  </defs>
  <rect width="1000" height="620" rx="28" fill="url(#bg)"/>
  <g opacity=".12" stroke="#8db4ef"><path d="M0 80h1000M0 160h1000M0 240h1000M0 320h1000M0 400h1000M0 480h1000M0 560h1000"/><path d="M80 0v620M160 0v620M240 0v620M320 0v620M400 0v620M480 0v620M560 0v620M640 0v620M720 0v620M800 0v620M880 0v620M960 0v620"/></g>
  <text x="56" y="66" fill="#7dd3e1" font-family="monospace" font-size="18" letter-spacing="3">MODEL FLOW / GPT-2</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(55 150)"><rect width="200" height="110" rx="16" fill="#132e58" stroke="#3569ad"/><text x="100" y="53" fill="#fff" font-size="26" font-weight="700">Tokens</text><text x="100" y="80" fill="#9fb7d8" font-size="16">input sequence</text></g>
    <path d="M255 205h70" stroke="#65cfe2" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(335 150)"><rect width="275" height="110" rx="16" fill="#132e58" stroke="#3569ad"/><text x="137" y="46" fill="#fff" font-size="25" font-weight="700">Embeddings</text><text x="137" y="76" fill="#9fb7d8" font-size="16">token + position</text></g>
    <path d="M610 205h70" stroke="#65cfe2" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(690 125)"><rect width="255" height="160" rx="18" fill="#163668" stroke="url(#accent)" stroke-width="2"/><text x="127" y="48" fill="#fff" font-size="25" font-weight="700">Transformer</text><text x="127" y="80" fill="#fff" font-size="25" font-weight="700">Blocks × N</text><rect x="32" y="104" width="191" height="35" rx="8" fill="#0c2448"/><text x="127" y="128" fill="#7dd3e1" font-size="15">causal self-attention</text></g>
    <path d="M817 285v72" stroke="#65cfe2" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(690 367)"><rect width="255" height="110" rx="16" fill="#132e58" stroke="#3569ad"/><text x="127" y="48" fill="#fff" font-size="24" font-weight="700">Language Model</text><text x="127" y="78" fill="#9fb7d8" font-size="16">head + weight tying</text></g>
    <path d="M690 422H540" stroke="#65cfe2" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(265 367)"><rect width="265" height="110" rx="16" fill="#132e58" stroke="#3569ad"/><text x="132" y="47" fill="#fff" font-size="24" font-weight="700">Next-token logits</text><text x="132" y="78" fill="#9fb7d8" font-size="16">sample / select token</text></g>
    <path d="M265 422H185v-75" stroke="#65cfe2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(55 497)"><rect width="890" height="70" rx="15" fill="#0d2244" stroke="#28598e"/><text x="445" y="44" fill="#dbeafe" font-size="21" font-weight="700">Autoregressive loop: append prediction → run the expanded sequence again</text></g>
  </g>
</svg>
